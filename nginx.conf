server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}