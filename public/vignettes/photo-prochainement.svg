<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Photo prochainement</title>
  <desc id="desc">Vignette neutre DeliKreol utilisée lorsque la photo du produit n'est pas encore disponible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#f6e7da"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5b2d1a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="1060" cy="120" r="150" fill="#f59e0b" opacity="0.12"/>
  <circle cx="120" cy="790" r="190" fill="#166534" opacity="0.08"/>
  <g filter="url(#shadow)" transform="translate(600 390)">
    <ellipse cx="0" cy="0" rx="250" ry="180" fill="#fff" stroke="#ead8c8" stroke-width="18"/>
    <ellipse cx="0" cy="0" rx="175" ry="112" fill="url(#plate)" opacity="0.92"/>
    <path d="M-62-52c20-34 60-40 89-16 14 12 22 30 22 49 0 44-39 79-88 79-34 0-63-17-79-43 18 3 38-2 52-16 15-15 20-35 14-53z" fill="#fff7ed" opacity="0.94"/>
    <circle cx="85" cy="-20" r="34" fill="#fbbf24"/>
    <path d="M-245-155l-38-86M-210-166l-21-94M245-155l38-86M210-166l21-94" stroke="#6b3f2d" stroke-width="18" stroke-linecap="round"/>
  </g>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#2b170f">PHOTO PROCHAINEMENT</text>
  <text x="600" y="716" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="600" fill="#6b5b50">Le partenaire finalise ce visuel</text>
  <g transform="translate(600 790)">
    <rect x="-126" y="-28" width="252" height="56" rx="28" fill="#c2410c"/>
    <text x="0" y="10" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#fff">DELIKREOL</text>
  </g>
</svg>
