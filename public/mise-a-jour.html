<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mise à jour DeliKreol</title><style>body{font:18px system-ui;background:#fff8f0;color:#281b12;max-width:520px;margin:15vh auto;padding:24px}a{color:#b74406}button{background:#b74406;color:white;border:0;padding:16px;border-radius:12px;font:inherit}</style><h1>Mettre DeliKreol à jour</h1><p id="status" role="status">Votre panier et votre connexion seront conservés.</p><button id="update">Mettre à jour et ouvrir Langouste House</button><script>
document.getElementById('update').onclick=async()=>{const button=document.getElementById('update'),status=document.getElementById('status');button.disabled=true;status.textContent='Vérification de la dernière version…';try{const response=await fetch('/release.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('Connexion indisponible');await response.json();if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.filter(r=>new URL(r.scope).origin===location.origin).map(r=>r.unregister()));}if('caches'in window){await Promise.all((await caches.keys()).filter(k=>k.startsWith('workbox-')||k.startsWith('delikreol-')).map(k=>caches.delete(k)));}location.replace('/traiteur/langouste-house/?mise-a-jour='+Date.now());}catch(e){status.textContent='Mise à jour impossible. Vérifiez votre connexion puis réessayez.';button.disabled=false;}};
</script></html>
