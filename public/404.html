<!doctype html>
<html lang="fr-MQ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeliKreol — Commandez créole local en Martinique</title>
    <meta name="description" content="Commande de plats créoles en Martinique. Traiteurs locaux, livraison et retrait. Commandez en ligne vos plats maison." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://delikreol.com/" />
    <meta property="og:title" content="DeliKreol — Commandez créole local en Martinique | Livraison & Traiteur" />
    <meta property="og:description" content="Commande de plats créoles en Martinique. Traiteurs locaux, livraison et retrait. Commandez en ligne vos plats maison." />
    <meta property="og:url" content="https://delikreol.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      SPA fallback — GitHub Pages compatible.
      Ce fichier est copié dans dist/404.html à chaque build (full index.html).
      En attente du CI, cette version sert de fallback minimal avec redirection.
    -->
    <script>
      // Redirection SPA pour GitHub Pages — toutes les routes servent l'app
      (function() {
        var redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          window.location.replace(redirect);
        } else {
          // Pas de redirect en session → charger la page d'accueil
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirection vers DeliKreol…</p>
    <script>
      // Fallback: rediriger vers la racine de l'application
      sessionStorage.setItem('redirect', window.location.href);
      window.location.href = '/';
    </script>
  </body>
</html>
