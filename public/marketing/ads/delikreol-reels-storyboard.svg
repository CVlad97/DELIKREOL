<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
<title id="title">Storyboard Reel DeliKreol</title><desc id="desc">Storyboard vertical pour Reel Instagram et Facebook.</desc>
<rect width="1080" height="1920" fill="#24140d"/><rect y="0" width="1080" height="22" fill="#c14300"/><rect y="22" width="1080" height="12" fill="#27a95d"/>
<text x="70" y="155" font-family="Arial, sans-serif" font-size="42" font-weight="900" fill="#f8bd35">REEL 15s — DELIKREOL</text>
<g font-family="Arial, sans-serif" font-weight="900"><rect x="70" y="240" width="940" height="350" rx="48" fill="#fff8ef"/><text x="120" y="350" font-size="58" fill="#24140d">1. Tu veux manger local ?</text><text x="120" y="440" font-size="38" fill="#6f5b4b">Plan serré plat + texte rapide</text><text x="120" y="510" font-size="34" fill="#c14300">0–4 sec</text><rect x="70" y="660" width="940" height="350" rx="48" fill="#fff8ef"/><text x="120" y="770" font-size="58" fill="#24140d">2. Ajoute au panier.</text><text x="120" y="860" font-size="38" fill="#6f5b4b">Capture mobile + clic catalogue</text><text x="120" y="930" font-size="34" fill="#c14300">4–8 sec</text><rect x="70" y="1080" width="940" height="350" rx="48" fill="#fff8ef"/><text x="120" y="1190" font-size="58" fill="#24140d">3. Confirme WhatsApp.</text><text x="120" y="1280" font-size="38" fill="#6f5b4b">Numéro commande + rassurance</text><text x="120" y="1350" font-size="34" fill="#c14300">8–12 sec</text><rect x="70" y="1500" width="940" height="280" rx="48" fill="#c14300"/><text x="120" y="1610" font-size="58" fill="#fff">Commande local.</text><text x="120" y="1700" font-size="42" fill="#fff8ef">delikreol.com</text></g>
</svg>
