# DELIKREOL — durcissement SSH (drop-in OpenSSH)
# Cible : /etc/ssh/sshd_config.d/99-delikreol-hardening.conf
#
# PRÉ-REQUIS ABSOLU avant d'appliquer :
#   1. une clé publique est présente dans /root/.ssh/authorized_keys (ou l'utilisateur d'admin) ;
#   2. vous venez de réussir une connexion PAR CLÉ dans une session que vous gardez ouverte ;
#   3. vous avez accès à la console VNC/Web Hostinger en cas de verrouillage.
#
# Sans ces trois points, ce fichier vous enferme dehors.

# Authentification : clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Root : interdit par mot de passe, autorisé par clé (prohibit-password).
# Si un utilisateur non-root avec sudo existe, préférer `PermitRootLogin no`.
PermitRootLogin prohibit-password

# Limitation de la surface d'attaque
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no
ClientAliveInterval 300
ClientAliveCountMax 2
UseDNS no
