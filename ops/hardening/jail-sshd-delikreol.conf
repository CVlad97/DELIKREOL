# DELIKREOL — jail fail2ban pour sshd
# Cible : /etc/fail2ban/jail.d/delikreol-sshd.conf
#
# Complète le drop-in sshd : avec l'authentification par clé seule, le bruteforce
# reste possible mais coûteux. fail2ban le rend visible et le bannit.
#
#   sudo apt-get install -y fail2ban
#   sudo install -m644 jail-sshd-delikreol.conf /etc/fail2ban/jail.d/delikreol-sshd.conf
#   sudo fail2ban-client -t && sudo systemctl enable --now fail2ban && sudo systemctl restart fail2ban

[sshd]
enabled  = true
port     = ssh
filter   = sshd
logpath  = %(sshd_log)s
backend  = %(sshd_backend)s
mode     = aggressive
maxretry = 3
findtime = 10m
bantime  = 1h

# Ne jamais bannir localhost ni l'IP d'administration habituelle.
# Ajoutez votre IP fixe ici si vous en avez une (elle change en 4G/5G).
ignoreip = 127.0.0.1/8 ::1
