# DELIKREOL — vhost applicatif corrigé (routes profondes sans redirection)
#
# PROBLÈME MESURÉ EN PRODUCTION (14/11/2026)
#   /admin     → 301 Location: /admin/
#   /catalogue → 301 Location: /catalogue/
#   /panier    → 301 Location: /panier/
# puis 200 sur la variante avec slash.
#
# CAUSE : `try_files $uri $uri/ /index.html;` — dès que `$uri/` correspond à un
# répertoire (les copies de routes générées par scripts/generate-spa-route-copies.mjs),
# nginx émet un 301 pour ajouter le slash. Chaque lien profond paie donc un aller-retour
# supplémentaire, et les URLs indexées subissent une redirection permanente.
#
# CORRECTIF : tester explicitement `$uri/index.html` AVANT toute correspondance de
# répertoire. nginx sert alors la copie de route avec un 200 direct, en conservant
# les métadonnées par route (l'intérêt même de ces copies).
#
# ⚠️ NON VALIDÉ PAR `nginx -t` : nginx n'est pas installé dans l'environnement de
# préparation. À tester sur le VPS avant rechargement (`nginx -t`), puis vérifier avec
# `bash ops/hardening/verify.sh delikreol.com` et un `curl -o /dev/null -w '%{http_code}'`
# sur /admin, /catalogue, /panier : attendu 200 direct, plus de 301 ; et sur une URL
# inexistante : attendu 404, plus 200.

server {
    listen 80;
    server_name delikreol.com www.delikreol.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name delikreol.com www.delikreol.com;

    root /usr/share/nginx/html;
    index index.html;

    # Mettre les chemins réels des certificats Let's Encrypt du VPS.
    ssl_certificate     /etc/letsencrypt/live/delikreol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delikreol.com/privkey.pem;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # En-têtes de sécurité : dans CHAQUE bloc qui définit un add_header
    # (voir README.md, piège d'héritage nginx).
    include /etc/nginx/snippets/delikreol-security.conf;

    location = / {
        include /etc/nginx/snippets/delikreol-security.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /index.html =404;
    }

    location = /sw.js {
        include /etc/nginx/snippets/delikreol-security.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/delikreol-security.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Assets hashés : cache long, jamais d'index de répertoire.
    location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        include /etc/nginx/snippets/delikreol-security.conf;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cœur du correctif : la copie de route est servie AVANT la correspondance
    # de répertoire, donc plus de 301 sur les liens profonds.
    location / {
        include /etc/nginx/snippets/delikreol-security.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/index.html /index.html;
    }

    # SOFT-404 MESURÉ : /page-qui-nexiste-pas-42 et /catalogue/xyz-inexistant répondent
    # aujourd'hui 200. Tout 404 est réécrit en 200 par `error_page 404 /index.html;`,
    # ce qui masque les liens morts et pénalise l'indexation. Le `=404` conserve le
    # code HTTP tout en servant la coquille SPA (le routeur affiche sa page introuvable).
    error_page 404 =404 /index.html;

    # Les 5xx ne doivent pas servir l'application : une erreur serveur affichée comme
    # une page normale est invisible en supervision.
    error_page 500 502 503 504 =503 /index.html;
}
