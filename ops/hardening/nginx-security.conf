# DELIKREOL — en-têtes de sécurité nginx
# Cible : vhost 443 de delikreol.com / www.delikreol.com (nginx 1.24, Ubuntu)
#
# INSTALLATION
#   sudo install -m644 nginx-security.conf /etc/nginx/snippets/delikreol-security.conf
#   puis, dans CHAQUE bloc qui définit déjà un add_header :
#       include /etc/nginx/snippets/delikreol-security.conf;
#
# ⚠️ PIÈGE NGINX : `add_header` n'est PAS hérité dès qu'un bloc enfant en définit un.
# Le nginx.conf actuel pose des add_header dans `location = /sw.js`, `/index.html`,
# les assets et `/`. Un include au niveau `server` serait donc ignoré dans ces blocs.
# C'est l'erreur classique du durcissement « fait mais invisible ».

server_tokens off;

# HSTS — commencer par 1 an, sans preload. `includeSubDomains` n'est sûr que si
# tous les sous-domaines sont en HTTPS (vérifier avant d'activer).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(self), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP en REPORT-ONLY pour la phase 1 : elle n'applique rien, elle révèle les casse.
# Passer en `Content-Security-Policy` seulement après 7 jours de console propre.
# `unsafe-inline` reste nécessaire pour les styles injectés (Leaflet, React inline)
# et pour le bootstrap ; le retirer demande des nonces côté build, à faire en phase 3.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.stripe.com; frame-src 'self' https://*.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Durcissement des chemins sensibles : aucun service worker ni manifest servi
# depuis un répertoire utilisateur, et pas de listing.
autoindex off;
