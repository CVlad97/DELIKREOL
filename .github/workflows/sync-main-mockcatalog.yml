name: Sync main mock catalogue

on:
  push:
    branches:
      - fix/goute-mwen-photos-bankable

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goute-mwen-photos-bankable
          fetch-depth: 0

      - name: Use the current main catalogue
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- src/data/mockCatalog.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/mockCatalog.ts
          git commit -m "chore: sync catalogue fixes from main"
          git push origin HEAD:fix/goute-mwen-photos-bankable
