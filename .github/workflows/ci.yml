name: CI

# Vérification uniquement : ce workflow ne publie rien.
# La production est le VPS nginx (voir scripts/deploy-vps.mjs).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: SumUp checkout contract
        run: npm run test:sumup

      - name: Audit secrets
        run: npm run audit:secrets

      - name: Audit médias catalogue
        run: npm run audit:catalog-media

      - name: Build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: https://boihlgodmclljtckhmgz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_LE_NgMgaOlJEhkJlVF_zow_4NNOtTHX
          VITE_PUBLIC_VENDOR_SOURCE: hybrid
          VITE_DEMO_MODE: "false"
          VITE_ENABLE_GOOGLE_AUTH: ${{ secrets.VITE_ENABLE_GOOGLE_AUTH }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_ENABLE_STRIPE_PUBLIC: ${{ secrets.VITE_ENABLE_STRIPE_PUBLIC }}
          VITE_SUMUP_ENABLED: "true"
        run: npm run build
