name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        shell: bash
        run: |
          npx tsc --noEmit -p tsconfig.app.json --pretty false 2>&1 | tee /tmp/typecheck.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: /tmp/typecheck.log
          retention-days: 3

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        shell: bash
        run: |
          npm run test:e2e 2>&1 | tee /tmp/e2e.log
          test ${PIPESTATUS[0]} -eq 0
        env:
          PLAYWRIGHT_USE_PREBUILT: "true"

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            /tmp/e2e.log
            playwright-report/
            test-results/
          retention-days: 3
