name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Capture E2E diagnostics
        shell: bash
        env:
          PLAYWRIGHT_USE_PREBUILT: "true"
        run: |
          set +e
          npm run test:e2e > e2e.log 2>&1
          echo "$?" > e2e.exit
          exit 0

      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e.log
            e2e.exit

      - name: Enforce E2E result
        shell: bash
        run: |
          cat e2e.log
          test "$(cat e2e.exit)" = "0"
