name: Playwright — Images visuelles
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Playwright visual tests
        run: npm run test:e2e -- --workers=1
        env:
          CI: true

      - name: Run production smoke test
        run: npm run test:e2e -- images.production-smoke.spec.ts --workers=1
        env:
          E2E_BASE_URL: https://delikreol.com
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-screenshots
          path: reports/images-before/
          if-no-files-found: warn
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
