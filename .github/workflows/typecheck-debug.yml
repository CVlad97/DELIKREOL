name: Typecheck Debug

on:
  push:
    branches:
      - fix/goute-mwen-photos-bankable

jobs:
  typecheck-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - name: Capture typecheck output
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          echo "$code" > typecheck.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-debug
          path: |
            typecheck.log
            typecheck.exit
